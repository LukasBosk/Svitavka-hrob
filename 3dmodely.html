<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Modely – Svitávka - žárový pohřeb, mladší až pozdní doba bronzová</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      color: #e0e0e0;
      overflow-x: hidden;
    }

    /* Horní lišta */
    .header {
      height: 50px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 1.1rem;
      color: #e5a93c;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: #3a3a3a;
      border-color: #e5a93c;
    }

    /* Hlavní kontejner pro 3D modely */
    .models-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      justify-content: center;
    }

    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1600px;
    }

    .model-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: min(calc(100vh - 100px), 650px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .model-card iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 960px) {
      .models-grid {
        grid-template-columns: 1fr;
      }
      .model-card {
        height: 450px;
      }
    }
  </style>
</head>
<body>

  <!-- Horní lišta -->
  <div class="header">
    <h1>Svitávka - žárový pohřeb, mladší až pozdní doba bronzová</h1>
    <div class="controls">
      <a href="galerie.html" class="btn">Galerie fotek</a>
      <a href="index.html" class="btn">← Zpět na plánek</a>
    </div>
  </div>

  <!-- Kontejner s 3D modely ze Sketchfabu -->
  <div class="models-container">
    <div class="models-grid">
      
      <!-- 3D Model 1 -->
      <div class="model-card">
        <iframe 
          title="Svitávka - žárový hrob, model 1" 
          src="https://sketchfab.com/models/fc745359699947b3a4075735790a020e/embed?autostart=1" 
          allow="autoplay; fullscreen; xr-spatial-tracking" 
          execution-while-out-of-viewport 
          execution-while-not-rendered 
          web-share>
        </iframe>
      </div>

      <!-- 3D Model 2 -->
      <div class="model-card">
        <iframe 
          title="Svitávka - žárový hrob, model 2" 
          src="https://sketchfab.com/models/3299a77e6ff044a7b8fda61cd0a0289c/embed?autostart=1" 
          allow="autoplay; fullscreen; xr-spatial-tracking" 
          execution-while-out-of-viewport 
          execution-while-not-rendered 
          web-share>
        </iframe>
      </div>

    </div>
  </div>

</body>
</html>
