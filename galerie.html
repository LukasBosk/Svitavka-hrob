<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie – Svitávka - žárový pohřeb, mladší až pozdní doba bronzová</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      color: #e0e0e0;
      overflow-x: hidden;
    }

    /* Horní lišta */
    .header {
      height: 50px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 1.1rem;
      color: #e5a93c;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: #3a3a3a;
      border-color: #e5a93c;
    }

    /* Mřížka galerie */
    .gallery-container {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      height: 220px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .gallery-card:hover {
      transform: translateY(-4px);
      border-color: #e5a93c;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-card:hover img {
      transform: scale(1.05);
    }

    /* Lightbox modal okno */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      z-index: 1000;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .lightbox.active {
      display: flex;
      opacity: 1;
    }

    .lightbox-header {
      height: 50px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 1010;
    }

    .lightbox-title {
      font-size: 0.95rem;
      color: #e5a93c;
      font-weight: 600;
    }

    .lightbox-controls {
      display: flex;
      gap: 8px;
    }

    .lightbox-body {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .lightbox-img-container {
      max-width: 90%;
      max-height: 85vh;
      transition: transform 0.05s ease-out;
      transform-origin: center center;
      cursor: grab;
    }

    .lightbox-img-container:active {
      cursor: grabbing;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 85vh;
      display: block;
      border-radius: 4px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      pointer-events: none;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(20, 20, 20, 0.7);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
      z-index: 1005;
    }

    .nav-btn:hover {
      background: #e5a93c;
      color: #121212;
      border-color: #e5a93c;
    }

    .nav-prev { left: 20px; }
    .nav-next { right: 20px; }

    .lightbox-close {
      background: #333;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Svitávka - žárový pohřeb, mladší až pozdní doba bronzová</h1>
    <div class="controls">
      <a href="3dmodely.html" class="btn">3D Modely</a>
      <a href="text.html" class="btn">O nálezu</a>
      <a href="index.html" class="btn">← Zpět na plánek</a>
    </div>
  </div>

  <div class="gallery-container">
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-header">
      <div class="lightbox-title" id="lightboxTitle">Fotografie</div>
      <div class="lightbox-controls">
        <button class="btn" id="lbZoomIn">🔍 +</button>
        <button class="btn" id="lbZoomOut">🔍 −</button>
        <button class="btn" id="lbReset">↺ Reset</button>
        <button class="btn lightbox-close" onclick="closeLightbox()">✕ Zavřít</button>
      </div>
    </div>

    <div class="lightbox-body" id="lightboxBody">
      <button class="nav-btn nav-prev" onclick="changeImage(-1)">❮</button>
      
      <div class="lightbox-img-container" id="imgContainer">
        <img src="" id="lightboxImg" class="lightbox-img" alt="Detail">
      </div>

      <button class="nav-btn nav-next" onclick="changeImage(1)">❯</button>
    </div>
  </div>

  <script>
    const TOTAL_IMAGES = 18;
    const galleryItems = [];
    const galleryGrid = document.getElementById('galleryGrid');

    for (let i = 1; i <= TOTAL_IMAGES; i++) {
      const src = `${i}.jpg`;
      galleryItems.push({ src });

      const card = document.createElement('div');
      card.className = 'gallery-card';
      card.onclick = () => openLightbox(i - 1);

      const img = document.createElement('img');
      img.src = src;
      img.alt = `Fotografie ${i}`;
      img.loading = 'lazy';

      card.appendChild(img);
      galleryGrid.appendChild(card);
    }

    let currentIndex = 0;
    let lbScale = 1;
    let lbPanX = 0;
    let lbPanY = 0;
    let lbIsDragging = false;
    let lbStartX = 0;
    let lbStartY = 0;

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const imgContainer = document.getElementById('imgContainer');
    const lightboxBody = document.getElementById('lightboxBody');

    function updateLightboxTransform() {
      imgContainer.style.transform = `scale(${lbScale}) translate(${lbPanX}px, ${lbPanY}px)`;
    }

    function setLbZoom(newScale) {
      lbScale = Math.min(Math.max(1, newScale), 5);
      if (lbScale === 1) {
        lbPanX = 0;
        lbPanY = 0;
      }
      updateLightboxTransform();
    }

    function openLightbox(index) {
      currentIndex = index;
      const item = galleryItems[currentIndex];
      lightboxImg.src = item.src;
      lightboxTitle.textContent = `Fotografie ${currentIndex + 1} / ${galleryItems.length}`;
      setLbZoom(1);
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
    }

    function changeImage(direction) {
      currentIndex = (currentIndex + direction + galleryItems.length) % galleryItems.length;
      openLightbox(currentIndex);
    }

    document.getElementById('lbZoomIn').addEventListener('click', () => setLbZoom(lbScale + 0.5));
    document.getElementById('lbZoomOut').addEventListener('click', () => setLbZoom(lbScale - 0.5));
    document.getElementById('lbReset').addEventListener('click', () => setLbZoom(1));

    lightboxBody.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.25 : -0.25;
      setLbZoom(lbScale + delta);
    }, { passive: false });

    imgContainer.addEventListener('mousedown', (e) => {
      if (lbScale <= 1) return;
      lbIsDragging = true;
      lbStartX = e.clientX;
      lbStartY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!lbIsDragging) return;
      const dx = (e.clientX - lbStartX) / lbScale;
      const dy = (e.clientY - lbStartY) / lbScale;
      lbPanX += dx;
      lbPanY += dy;
      lbStartX = e.clientX;
      lbStartY = e.clientY;
      updateLightboxTransform();
    });

    window.addEventListener('mouseup', () => {
      lbIsDragging = false;
    });

    window.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') changeImage(-1);
      if (e.key === 'ArrowRight') changeImage(1);
    });
  </script>
</body>
</html>
